<div class="registro-container">
  <h2>Crear Cuenta</h2>

  <form (ngSubmit)="registrar()">
    <div class="form-nombre">
      <input
        type="text"
        id="nombre"
        name="nombre"
        [(ngModel)]="datosRegistro.nombre"
        (blur)="validarNombre()"
        required
      />
      <label for="nombre">Nombre Completo</label>
      <small class="error" *ngIf="errores.nombre">{{ errores.nombre }}</small>
    </div>

    <div class="form-email">
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="datosRegistro.email"
        (blur)="validarEmail()"
        required
      />
      <label for="email">Correo</label>
      <small class="error" *ngIf="errores.email">{{ errores.email }}</small>
    </div>

    <div class="form-contraseña">
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="datosRegistro.contrasena"
        (blur)="validarContrasena()"
        required
      />
      <label for="password">Contraseña</label>
      <small class="error" *ngIf="errores.contrasena">{{
        errores.contrasena
      }}</small>
    </div>

    <div class="form-confirm">
      <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        [(ngModel)]="datosRegistro.confirmarContrasena"
        (blur)="validarConfirmarContrasena()"
        required
      />
      <label for="confirmPassword">Confirmar Contraseña</label>
      <small class="error" *ngIf="errores.confirmarContrasena">{{
        errores.confirmarContrasena
      }}</small>
    </div>

    <button type="submit">Registrarme</button>
  </form>

  <div class="login-link">
    <p>¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </div>
</div>
